# Local development services. `docker compose -f infra/docker-compose.yml up -d`
services:
  mongo:
    image: mongo:8.0
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 5s
      retries: 10

  # LLM gateway (infra/litellm/config.yaml). Reads GEMINI_API_KEY and LITELLM_API_KEY from .env.local.
  litellm:
    image: ghcr.io/berriai/litellm:v1.105.1
    command: ['--config', '/app/config.yaml', '--port', '4000']
    ports:
      - '4000:4000'
    env_file:
      - path: ../.env.local
        required: false
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      retries: 10

volumes:
  mongo-data:
