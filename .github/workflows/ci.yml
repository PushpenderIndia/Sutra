name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      # Eval harness (PR 18): runs offline and fails if any agent metric is below target.
      - run: pnpm --filter @sutra/agents eval
      - run: pnpm build
      # No secret value may appear in the browser bundle.
      - run: node apps/web/scripts/check-client-bundle.mjs
      # Dependency audit (advisory; surfaced but non-blocking so a new low-sev advisory can't wedge CI).
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
